name: Windows and Linux builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version to publish after all checks, for example v1.4.0
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run storage checks and compile UI tests
        run: ./scripts/Test.ps1 -CompileUiTests
      - name: Install official Inno Setup compiler
        run: |
          choco install innosetup --version=6.7.3 --yes --no-progress
          if($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Build portable application and EXE installer
        run: ./scripts/Package.ps1 -Architecture $env:TARGET_ARCH -BuildInstaller
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Yarnelo-Windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11.17'
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3 libglib2.0-0 libfontconfig1 libfreetype6 libice6 libsm6 xdg-utils libglib2.0-bin patchelf squashfs-tools rpm ruby ruby-dev build-essential xvfb dbus-x11 desktop-file-utils
          sudo gem install fpm --version 1.16.0 --no-document
          python -m pip install -r linux/requirements.txt pyinstaller==6.22.3
      - name: Check model, shell scripts and offscreen rendering
        run: |
          python -m unittest discover -s linux/tests -v
          bash -n scripts/Package-Linux.sh linux/packaging/AppRun
          python linux/yarnelo.py --smoke-test --smoke-output work/linux-preview.png
      - name: Download and verify official AppImage tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/FetchReleaseAsset.py appimagetool work/tools/appimagetool-x86_64.AppImage
          python scripts/FetchReleaseAsset.py runtime work/tools/runtime-x86_64
      - name: Build and test standalone Linux packages
        run: |
          APPIMAGETOOL="$PWD/work/tools/appimagetool-x86_64.AppImage" APPIMAGE_RUNTIME="$PWD/work/tools/runtime-x86_64" bash scripts/Package-Linux.sh --output dist --version "$(cat VERSION)" --smoke-test
      - name: Verify DEB installation on Ubuntu and Debian
        run: |
          for image in ubuntu:24.04 debian:12; do
            docker run --rm -v "$PWD/dist:/packages:ro" "$image" sh -ec 'apt-get update -qq; apt-get install -y /packages/Yarnelo-Linux-amd64.deb; QT_QPA_PLATFORM=offscreen yarnelo --smoke-test'
          done
      - name: Verify RPM installation on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" fedora:44 sh -ec 'dnf install -y /packages/Yarnelo-Linux-x86_64.rpm; QT_QPA_PLATFORM=offscreen yarnelo --smoke-test'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Yarnelo-Linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish checked release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Collect checked artifacts and validate version
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'Yarnelo-*' --dir release-input
          tag="$REQUESTED_RELEASE_TAG"
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag="$GITHUB_REF_NAME"; fi
          python3 scripts/PrepareRelease.py "$tag" release-input release-assets
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - name: Publish installers and portable packages
        run: |
          args=(release create "$RELEASE_TAG" --title "Yarnelo $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md)
          if [ "$GITHUB_EVENT_NAME" = push ]; then args+=(--verify-tag); else args+=(--target "$GITHUB_SHA"); fi
          gh "${args[@]}" release-assets/*
