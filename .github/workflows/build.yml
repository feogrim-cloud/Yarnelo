name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      compile_ui_tests:
        description: Compile UI tests without opening windows
        type: boolean
        default: true
      release_tag:
        description: Optional release tag matching the built version, for example v1.3.1
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run isolated storage tests and compile UI tests
        run: |
          $compileUi = '${{ inputs.compile_ui_tests }}' -ne 'false'
          ./scripts/Test.ps1 -CompileUiTests:$compileUi
      - name: Build and package portable application
        run: ./scripts/Package.ps1
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Yarnelo-Windows11-x64
          path: |
            dist/Yarnelo-Windows11-x64.zip
            dist/Yarnelo-Windows11-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Download verified build artifact
        run: |
          gh run download $env:GITHUB_RUN_ID --name Yarnelo-Windows11-x64 --dir dist
          if($LASTEXITCODE -ne 0) { throw 'Could not download this run artifact.' }
          $archive = Join-Path (Get-Location).Path 'dist/Yarnelo-Windows11-x64.zip'
          $expected = ((Get-Content -LiteralPath ($archive + '.sha256') -Raw).Trim() -split '\s+')[0]
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
              throw 'The portable archive checksum does not match.'
          }
      - name: Validate release tag against the compiled application
        run: |
          Expand-Archive -LiteralPath 'dist/Yarnelo-Windows11-x64.zip' -DestinationPath 'release-check'
          $executable = Join-Path (Get-Location).Path 'release-check/Yarnelo.exe'
          $version = [Version]([Diagnostics.FileVersionInfo]::GetVersionInfo($executable).FileVersion)
          $expectedTag = 'v{0}.{1}.{2}' -f $version.Major, $version.Minor, $version.Build
          $tag = if($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } else { $env:REQUESTED_RELEASE_TAG }
          if($tag -notmatch '^v\d+\.\d+\.\d+$' -or $tag -ne $expectedTag) {
              throw "Release tag must match the compiled application version: $expectedTag"
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_TAG=$tag`n", [Text.UTF8Encoding]::new($false))
      - name: Publish tagged release
        run: |
          $arguments = @('release','create',$env:RELEASE_TAG,'--title',"Yarnelo $env:RELEASE_TAG",'--generate-notes')
          if($env:GITHUB_EVENT_NAME -eq 'push') {
              $arguments += '--verify-tag'
          } else {
              $arguments += @('--target',$env:GITHUB_SHA)
          }
          $arguments += @('dist/Yarnelo-Windows11-x64.zip','dist/Yarnelo-Windows11-x64.zip.sha256')
          & gh @arguments
          if($LASTEXITCODE -ne 0) { throw 'Could not publish the tagged release.' }
